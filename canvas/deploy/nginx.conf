# Превью альтернативной версии сайта.
#
# Живёт на том же сервере, что и бот, отдельным server-блоком. Боевой
# universe-design.com при этом не затронут: он по-прежнему на GitHub Pages,
# A-записи домена сюда не смотрят.
#
# Файл лежит в репозитории намеренно: сервер должен пересоздаваться из кода,
# а не из памяти. Копия — /etc/nginx/sites-available/canvas.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Пока DNS-записи на поддомен нет, сюда попадают и обращения по IP —
    # это позволяет проверять деплой, не дожидаясь правки зоны.
    server_name canvas.universe-design.com _;

    root /var/www/canvas/dist;
    index index.html;

    # Это превью, а не сайт. В индекс попасть не должно ни при каких
    # обстоятельствах: у боевого домена есть свой SEO-контур, и вторая копия
    # тех же текстов ему только навредит.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Заголовки, которых не было на GitHub Pages — там свои задать нельзя.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие. Brotli выигрывает у gzip около 15% на нашем бандле
    # (48.3 КБ против 55.7 на клиентском чанке), поэтому включён первым;
    # gzip остаётся для тех, кто br не понимает.
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/javascript application/json
                 image/svg+xml application/manifest+json;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Видео и его постер. Лежат мимо гита: бинарные блобы уже раздули .git
    # до 346 МБ, добавлять туда ещё незачем. Путь совпадает с MEDIA_BASE
    # в src/lib/media.js — менять только вместе с ним.
    location /media/ {
        alias /var/www/canvas-media/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag "noindex" always;

        # Перемотка видео без полной перезагрузки файла.
        add_header Accept-Ranges bytes;
    }

    # Хешированные ассеты: имя меняется при каждом изменении содержимого,
    # поэтому кэшировать можно навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Страницы. Пререндер выдаёт по файлу на URL, поэтому SPA-фолбэка
    # на index.html здесь нет: несуществующий адрес должен отвечать 404,
    # а не отдавать главную под чужим URL — иначе поисковик решит, что
    # у сайта бесконечное число страниц с одинаковым содержимым.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Честный 404 со статус-кодом. На GitHub Pages приходилось обходиться
    # файлом 404.html, здесь это настоящий ответ сервера.
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
