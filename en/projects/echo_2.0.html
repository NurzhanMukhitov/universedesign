    <script>
    // Меню на главной раскрывается по флагу в sessionStorage: его читает script.js
    // на DOMContentLoaded и на pageshow. Флаг ставят стрелка «назад» и переключатель языка.
    //
    // Смена языка идёт через location.replace, а не обычным переходом: иначе она
    // добавляла бы запись в историю, и «назад» сначала возвращал бы прежний язык
    // вместо выхода из раздела. Модифицированные клики (Cmd, Ctrl, средняя кнопка)
    // не перехватываем — пусть открываются в новой вкладке штатно.
    (function () {
        function raiseMenuFlag() {
            try { sessionStorage.setItem('justLeftIndex', 'true'); } catch (e) { /* storage закрыт */ }
        }
        var back = document.querySelector('.back-button');
        if (back) back.addEventListener('click', raiseMenuFlag, true);

        document.querySelectorAll('.lang-switch a').forEach(function (link) {
            link.addEventListener('click', function (event) {
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
                event.preventDefault();
                raiseMenuFlag();
                window.location.replace(link.href);
            });
        });

        var logoHome = document.querySelector('.logo-home');
        if (logoHome) {
            logoHome.addEventListener('click', function () {
                // куб на главной должен быть собран: флаг сессии не даёт запустить интро
                try { sessionStorage.setItem('cube_session_started', 'true'); } catch (e) { /* storage закрыт */ }
                raiseMenuFlag();
            }, true);
        }

        // Скролл внутри раздела прячет переключатель. Пороги разведены (48 и 16),
        // чтобы у верхнего края он не мигал от каждого мелкого движения колеса.
        var langSwitch = document.querySelector('.lang-switch:not(.lang-switch--home)');
        if (langSwitch) {
            var ticking = false;
            window.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                window.requestAnimationFrame(function () {
                    var y = window.scrollY || document.documentElement.scrollTop;
                    if (y > 48) langSwitch.classList.add('lang-switch--hidden');
                    else if (y < 16) langSwitch.classList.remove('lang-switch--hidden');
                    ticking = false;
                });
            }, { passive: true });
        }
    })();
    </script>

      By using our site you agree to the use of cookies.
      <a class="cookie-notice__link" href="/en/privacy.html">Privacy Policy</a></p>
      <button type="button" class="cookie-notice__button" id="cookie-accept">Accept</button>
    </div>
  </div>

  <script>
  // Уведомление о cookie. На главной ждём, пока соберётся куб: полоса поверх
  // разлетающихся точек убивала бы весь эффект входа. На остальных страницах
  // показываем через небольшую паузу после загрузки.
  (function () {
    var KEY = 'cookie_notice_accepted';
    var notice = document.getElementById('cookie-notice');
    if (!notice) return;

    var accepted = false;
    try { accepted = localStorage.getItem(KEY) === 'true'; } catch (e) { /* storage закрыт */ }
    if (accepted) return;

    var shown = false;
    function show() {
      if (shown) return;
      shown = true;
      notice.style.display = 'block';
      // Принудительный пересчёт стилей: без него браузер объединяет display и
      // добавление класса в один кадр, начальное состояние (opacity 0) не
      // фиксируется и плашка появляется рывком вместо плавного проявления.
      void notice.offsetHeight;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { notice.classList.add('visible'); });
      });
    }
    // главная зовёт это сама, когда куб собран (см. script.js)
    window.showCookieNotice = show;

    if (!document.querySelector('.lang-switch--home')) {
      setTimeout(show, 900);
    }

    document.getElementById('cookie-accept').addEventListener('click', function () {
      try { localStorage.setItem(KEY, 'true'); } catch (e) { /* storage закрыт */ }
      notice.classList.remove('visible');
      setTimeout(function () { notice.style.display = 'none'; }, 450);
    });
  })();
  </script>
