    <div class="fullscreen-view">

            <button class="close-fullscreen" onclick="closeFullscreen()">×</button>

    <script>
        let currentItemIndex = 0;
        let galleryItems = [];
        
        function openFullscreen(img) {
            const fullscreenView = document.querySelector('.fullscreen-view');
            const mediaContainer = fullscreenView.querySelector('.fullscreen-media');
            
            // Получаем все элементы галереи (изображения И видео)
            const imgItems = Array.from(document.querySelectorAll('.gallery-item img'));
            const vimeoContainer = document.querySelector('.vimeo-container');
            
            galleryItems = []; // Очищаем массив
            
            // Добавляем все изображения и видео в массив элементов галереи
            // с метаданными о типе (image/video)
            imgItems.forEach(imgItem => {
                galleryItems.push({ type: 'image', element: imgItem });
            });
            
            // Вставляем видео в нужное место в массиве (после первого изображения)
            galleryItems.splice(1, 0, { 
                type: 'video', 
                element: vimeoContainer,
                url: 'https://player.vimeo.com/video/953543284?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479',
                title: 'LADA VESTA SW CROSS'
            });
            
            // Находим индекс текущего элемента
            if (img) {
                for (let i = 0; i < galleryItems.length; i++) {
                    if (galleryItems[i].type === 'image' && galleryItems[i].element === img) {
                        currentItemIndex = i;
                        break;
                    }
                }
            } else {
                currentItemIndex = 0;
            }
            
            updateFullscreenContent();
            fullscreenView.classList.add('active');
            
            document.addEventListener('keydown', handleKeyPress);
        }
        
        function updateFullscreenContent() {
            const mediaContainer = document.querySelector('.fullscreen-media');
            const currentItem = galleryItems[currentItemIndex];
            
            if (currentItem.type === 'image') {
                const img = currentItem.element;
                mediaContainer.innerHTML = `<img src="${img.src}" alt="${img.alt}">`;
                
                // Показываем навигационные кнопки
                document.querySelector('.prev-button').style.display = 'block';
                document.querySelector('.next-button').style.display = 'block';
            } else if (currentItem.type === 'video') {
                // Вставляем видео Vimeo
                mediaContainer.innerHTML = `
                    <div class="video-container">
                        <iframe src="${currentItem.url}" 
                                frameborder="0" 
                                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" 
                                title="${currentItem.title}">
                        </iframe>
                    </div>
                `;
                
                // Показываем навигационные кнопки и для видео
                document.querySelector('.prev-button').style.display = 'block';
                document.querySelector('.next-button').style.display = 'block';
            }
        }
        
        function closeFullscreen() {
            const fullscreenView = document.querySelector('.fullscreen-view');
            fullscreenView.classList.remove('active');
            document.removeEventListener('keydown', handleKeyPress);
        }
        
        function showNextImage() {
            currentItemIndex = (currentItemIndex + 1) % galleryItems.length;
            updateFullscreenContent();
        }
        
        function showPrevImage() {
            currentItemIndex = (currentItemIndex - 1 + galleryItems.length) % galleryItems.length;
            updateFullscreenContent();
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Escape') closeFullscreen();
            else if (e.key === 'ArrowRight') showNextImage();
            else if (e.key === 'ArrowLeft') showPrevImage();
        }
        
        // Показываем логотип при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const logoText = document.querySelector('.logo-text');
            setTimeout(() => {
                logoText.style.display = "block";
                requestAnimationFrame(() => {
                    logoText.classList.add('visible');
                });
            }, 100);
        });
    </script>




    <script>
    // Меню на главной раскрывается по флагу в sessionStorage: его читает script.js
    // на DOMContentLoaded и на pageshow. Флаг ставят стрелка «назад» и переключатель языка.
    //
    // Смена языка идёт через location.replace, а не обычным переходом: иначе она
    // добавляла бы запись в историю, и «назад» сначала возвращал бы прежний язык
    // вместо выхода из раздела. Модифицированные клики (Cmd, Ctrl, средняя кнопка)
    // не перехватываем — пусть открываются в новой вкладке штатно.
    (function () {
        function raiseMenuFlag() {
            try { sessionStorage.setItem('justLeftIndex', 'true'); } catch (e) { /* storage закрыт */ }
        }
        var back = document.querySelector('.back-button');
        if (back) back.addEventListener('click', raiseMenuFlag, true);

        document.querySelectorAll('.lang-switch a').forEach(function (link) {
            link.addEventListener('click', function (event) {
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
                event.preventDefault();
                raiseMenuFlag();
                window.location.replace(link.href);
            });
        });

        var logoHome = document.querySelector('.logo-home');
        if (logoHome) {
            logoHome.addEventListener('click', function () {
                // куб на главной должен быть собран: флаг сессии не даёт запустить интро
                try { sessionStorage.setItem('cube_session_started', 'true'); } catch (e) { /* storage закрыт */ }
                raiseMenuFlag();
            }, true);
        }

        // Скролл внутри раздела прячет переключатель. Пороги разведены (48 и 16),
        // чтобы у верхнего края он не мигал от каждого мелкого движения колеса.
        var langSwitch = document.querySelector('.lang-switch:not(.lang-switch--home)');
        if (langSwitch) {
            var ticking = false;
            window.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                window.requestAnimationFrame(function () {
                    var y = window.scrollY || document.documentElement.scrollTop;
                    if (y > 48) langSwitch.classList.add('lang-switch--hidden');
                    else if (y < 16) langSwitch.classList.remove('lang-switch--hidden');
                    ticking = false;
                });
            }, { passive: true });
        }
    })();
    </script>

  <script>
  // Уведомление о cookie. На главной ждём, пока соберётся куб: полоса поверх
  // разлетающихся точек убивала бы весь эффект входа. На остальных страницах
  // показываем через небольшую паузу после загрузки.
  (function () {
    var KEY = 'cookie_notice_accepted';
    var notice = document.getElementById('cookie-notice');
    if (!notice) return;

    var accepted = false;
    try { accepted = localStorage.getItem(KEY) === 'true'; } catch (e) { /* storage закрыт */ }
    if (accepted) return;

    var shown = false;
    function show() {
      if (shown) return;
      shown = true;
      notice.style.display = 'block';
      // Принудительный пересчёт стилей: без него браузер объединяет display и
      // добавление класса в один кадр, начальное состояние (opacity 0) не
      // фиксируется и плашка появляется рывком вместо плавного проявления.
      void notice.offsetHeight;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { notice.classList.add('visible'); });
      });
    }
    // главная зовёт это сама, когда куб собран (см. script.js)
    window.showCookieNotice = show;

    if (!document.querySelector('.lang-switch--home')) {
      setTimeout(show, 900);
    }

    document.getElementById('cookie-accept').addEventListener('click', function () {
      try { localStorage.setItem(KEY, 'true'); } catch (e) { /* storage закрыт */ }
      notice.classList.remove('visible');
      setTimeout(function () { notice.style.display = 'none'; }, 450);
    });
  })();
  </script>
